name: Photobooth CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photobooth-kiosk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test -- --passWithNoTests
      - name: Build application
        run: npm run build
      - name: Validate dashboard JavaScript
        run: node --check ../dashboard/app.js
      - name: Validate dashboard config
        run: node --check ../dashboard/config.js
